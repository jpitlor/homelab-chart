image:
  tag: v0.1.76

config:
  database:
    type: "postgres"
    host: {{ template "dev.pitlor.homelab.postgres-name" (list $ "donetick") }}
    port: 5432
    name: "donetick"
    secrets:
      existingSecret: "donetick-postgres-secret"
      userKey: "username"
      passwordKey: "password"

  oauth2:
    client_id: "{{ .Values.donetick.oidcClientId }}"
    client_secret: "{{ .Values.donetick.oidcClientSecret }}"
    auth_url: "https://auth.test.pitlor.dev/application/o/authorize/"
    token_url: "https://auth.test.pitlor.dev/application/o/token/"
    user_info_url: "https://auth.test.pitlor.dev/application/o/userinfo/"
    redirect_url: "https://todo.test.pitlor.dev/auth/oauth2"

  jwt:
    secret: "{{ .Values.donetick.jwtSecret }}"

  server:
    cors_allow_origins:
      - "https://todo.test.pitlor.dev"

  features:
    notifications: true
    realtime: true
    oauth: true
    is_user_creation_disabled: true

ingress:
  enabled: true
  className: traefik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: DoneTick
    gethomepage.dev/description: TODO Tracking
    gethomepage.dev/icon: donetick.png
    gethomepage.dev/group: Apps
    gethomepage.dev/pod-selector: ""
    traefik.ingress.kubernetes.io/router.entrypoints: ""
  hosts:
    - host: todo.test.pitlor.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: "ssd"
  size: "5Gi"
