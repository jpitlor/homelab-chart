# https://gitea.com/gitea/helm-gitea/src/branch/main/values.yaml
image:
  tag: 1.24.6

gitea:
  podAnnotations:
    "backup.velero.io/backup-volumes": data
  admin:
    username: jpitlor
    email: "jpitlor@gmail.com"
    password: {{ randAscii 20 | quote }}
    passwordMode: keepUpdated
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  oauth:
    - name: Authentik
      provider: openidConnect
      key: {{ .Values.gitea.oidcClientId }}
      secret: {{ .Values.gitea.oidcClientSecret }}
      autoDiscoverUrl: https://auth.pitlor.dev/application/o/gitea/.well-known/openid-configuration
      adminGroup: "gitea_admin"
      restrictedGroup: "gitea_restricted"
      groupClaimName: "gitea"
      scopes: "profile email gitea"
  config:
    actions:
      ENABLED: true
    server:
      ENABLE_PPROF: true
      ROOT_URL: https://code.pitlor.dev
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: "true"
    service:
      DISABLE_REGISTRATION: "true"
      ENABLE_BASIC_AUTHENTICATION: "false"
      ENABLE_PASSWORD_SIGNIN_FORM: "false"
    database:
      DB_TYPE: postgres
      HOST: {{ template "dev.pitlor.homelab.postgres-name" (list $ "gitea") }}
      NAME: gitea
      USER: gitea
      PASSWD: gitea
      SCHEMA: gitea

persistence:
  enabled: true
  storageClass: "ssd"

valkey-cluster:
  enabled: false

valkey:
  enabled: true

postgresql-ha:
  enabled: false

postgresql:
  enabled: false

ingress:
  className: "traefik"
  enabled: true
  nginx:
    enabled: false
  hosts:
    - host: code.pitlor.dev
      paths:
        - path: /
          pathType: Prefix
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Code Hosting
    gethomepage.dev/icon: gitea.png
    gethomepage.dev/name: Gitea
    gethomepage.dev/group: Software Development
    gethomepage.dev/pod-selector: ""

service:
  ssh:
    type: LoadBalancer
    port: 2222