# https://gitea.com/gitea/helm-gitea/src/branch/main/values.yaml
image:
  tag: 1.24.6

gitea:
  podAnnotations:
    "backup.velero.io/backup-volumes": data
  admin:
    username: jpitlor123
    email: jpitlor123@gmail.com
    password: {{ randAscii 20 }}
    passwordMode: initialOnlyNoReset
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  oauth:
    - name: Authentik
      provider: openidConnect
      key: {{ .Values.gitea.oidcClientId }}
      secret: {{ .Values.gitea.oidcClientSecret }}
      autoDiscoverUrl: https://auth.test.pitlor.dev/application/o/gitea/.well-known/openid-configuration
      adminGroup: "Homelab Admin"
  config:
    actions:
      ENABLED: true
    server:
      ENABLE_PPROF: true
      ROOT_URL: https://code.test.pitlor.dev
      ENABLE_BASIC_AUTHENTICATION: "false"
      ENABLE_PASSWORD_SIGNIN_FORM: "false"
    database:
      DB_TYPE: postgres
      HOST: {{ template "dev.pitlor.homelab.postgres-name" (list $ "gitea") }}
      NAME: gitea
      USER: gitea
      PASSWD: gitea
      SCHEMA: gitea

persistence:
  enabled: true
  storageClass: "ssd"

valkey-cluster:
  enabled: false

valkey:
  enabled: true

postgresql-ha:
  enabled: false

postgresql:
  enabled: false

ingress:
  className: "traefik"
  enabled: true
  nginx:
    enabled: false
  hosts:
    - host: code.test.pitlor.dev
      paths:
        - path: /
          pathType: Prefix
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Code Hosting
    gethomepage.dev/icon: gitea.png
    gethomepage.dev/name: Gitea
    gethomepage.dev/group: Software Development
    gethomepage.dev/pod-selector: ""